name: Deploy to Server

on:
  push:
    branches:
      - deploy

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          docker build -t todo-app:latest ./app

      - name: Save Docker image as artifact
        run: |
          docker save todo-app:latest | gzip > todo-app.tar.gz
        shell: bash

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: todo-app-image
          path: todo-app.tar.gz

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download Docker image artifact
        uses: actions/download-artifact@v4
        with:
          name: todo-app-image

      - name: Set up SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Copy Docker image to server
        run: |
          scp -o StrictHostKeyChecking=no todo-app.tar.gz ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:~/todo-app.tar.gz

      - name: Load and run Docker image on server
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "
            mv ~/todo-app.tar.gz ${{ secrets.SSH_TARGET_DIR }}/todo-app.tar.gz &&
            cd ${{ secrets.SSH_TARGET_DIR }} &&
            docker load -i todo-app.tar.gz &&
            docker compose down &&
            docker compose up -d --build
          "
